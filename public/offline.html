<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Offline — Easvarafy</title>
<style>
  :root { color-scheme: dark; --p: #8ab4ff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #000; color: #e6e8ee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) 20px 120px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .hero { text-align: center; padding: 32px 0 20px; }
  .icon { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px;
    display: grid; place-items: center; background: rgba(138,180,255,.14); color: var(--p); }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0; opacity: .7; font-size: 14px; line-height: 1.5; }
  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  button { font: inherit; border: 0; cursor: pointer; }
  .btn { height: 42px; padding: 0 20px; border-radius: 999px; font-weight: 600; font-size: 14px; }
  .primary { background: var(--p); color: #00174a; }
  .ghost { background: rgba(255,255,255,.1); color: #fff; }
  h2 { font-size: 15px; margin: 28px 4px 10px; }
  ul { list-style: none; margin: 0; padding: 0; border-radius: 22px; overflow: hidden;
    background: rgba(255,255,255,.05); }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; }
  li + li { border-top: 1px solid rgba(255,255,255,.06); }
  li.active { background: rgba(138,180,255,.14); }
  li img { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; background: #222; flex-shrink: 0; }
  .meta { min-width: 0; flex: 1; }
  .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a { font-size: 12px; opacity: .6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { padding: 28px; text-align: center; font-size: 13px; opacity: .6; }
  .player { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px max(12px, env(safe-area-inset-bottom));
    background: rgba(20,20,24,.96); border-top: 1px solid rgba(255,255,255,.08); display: none; }
  .player.show { display: block; }
  .player .now { font-size: 13px; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  audio { width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.5"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>Kamu sedang offline</h1>
    <p>Easvarafy butuh internet untuk streaming. Lagu yang sudah kamu download tetap bisa diputar di bawah ini.</p>
    <div class="actions">
      <button class="btn primary" id="retry" type="button">Coba Lagi</button>
      <button class="btn ghost" id="home" type="button">Buka Aplikasi</button>
    </div>
  </div>

  <h2>Lagu Tersimpan Offline</h2>
  <ul id="list"><li class="empty">Memuat…</li></ul>
</div>

<div class="player" id="player">
  <div class="now" id="now"></div>
  <audio id="audio" controls preload="auto"></audio>
</div>

<script>
(function () {
  var list = document.getElementById('list');
  var audio = document.getElementById('audio');
  var player = document.getElementById('player');
  var now = document.getElementById('now');
  var tracks = [];
  var current = -1;
  var cap = window.Capacitor;
  var isNative = !!(cap && cap.isNativePlatform && cap.isNativePlatform());

  document.getElementById('retry').onclick = function () { location.replace('/'); };
  document.getElementById('home').onclick = function () { location.href = '/'; };
  window.addEventListener('online', function () { location.replace('/'); });

  function fmtBytes(b) {
    if (!b) return '';
    var u = ['B', 'KB', 'MB', 'GB'], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i ? 1 : 0) + ' ' + u[i];
  }

  function loadNative() {
    var fs = cap.Plugins && cap.Plugins.Filesystem;
    if (!fs) return Promise.resolve([]);
    return fs.readFile({ path: 'offline/index.json', directory: 'DATA', encoding: 'utf8' })
      .then(function (r) {
        var data = JSON.parse(r.data);
        return (data.tracks || []).map(function (t) {
          return {
            title: t.title, artist: t.artist, size: t.fileSizeBytes,
            src: cap.convertFileSrc(t.localUri),
            art: t.localThumbUri ? cap.convertFileSrc(t.localThumbUri) : t.thumbnail
          };
        });
      })
      .catch(function () { return []; });
  }

  function loadWeb() {
    return new Promise(function (resolve) {
      if (!window.indexedDB) return resolve([]);
      var req = indexedDB.open('easvarafy-offline', 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains('tracks')) db.createObjectStore('tracks', { keyPath: 'videoId' });
        if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs');
      };
      req.onerror = function () { resolve([]); };
      req.onsuccess = function () {
        var db = req.result;
        try {
          var tx = db.transaction(['tracks', 'blobs'], 'readonly');
          var rows = [];
          tx.objectStore('tracks').getAll().onsuccess = function (e) {
            var items = e.target.result || [];
            var blobs = tx.objectStore('blobs');
            items.forEach(function (t) {
              var row = { title: t.title, artist: t.artist, size: t.fileSizeBytes, src: null, art: null, at: t.downloadedAt || 0 };
              rows.push(row);
              blobs.get('audio:' + t.videoId).onsuccess = function (ev) {
                if (ev.target.result) row.src = URL.createObjectURL(ev.target.result);
              };
              blobs.get('art:' + t.videoId).onsuccess = function (ev) {
                row.art = ev.target.result ? URL.createObjectURL(ev.target.result) : t.thumbnail;
              };
            });
          };
          tx.oncomplete = function () {
            resolve(rows.filter(function (r) { return r.src; }).sort(function (a, b) { return b.at - a.at; }));
          };
          tx.onerror = function () { resolve([]); };
        } catch (err) { resolve([]); }
      };
    });
  }

  function play(i) {
    if (!tracks[i]) return;
    current = i;
    audio.src = tracks[i].src;
    now.textContent = tracks[i].title + ' — ' + tracks[i].artist;
    player.classList.add('show');
    audio.play().catch(function () {});
    Array.prototype.forEach.call(list.children, function (li, idx) { li.classList.toggle('active', idx === i); });
  }
  audio.addEventListener('ended', function () { play((current + 1) % tracks.length); });

  function render() {
    list.innerHTML = '';
    if (!tracks.length) {
      list.innerHTML = '<li class="empty">Belum ada lagu tersimpan. Saat online, ketuk ikon download pada lagu untuk menyimpannya.</li>';
      return;
    }
    tracks.forEach(function (t, i) {
      var li = document.createElement('li');
      var img = document.createElement('img');
      img.alt = ''; if (t.art) img.src = t.art;
      img.onerror = function () { img.removeAttribute('src'); };
      var meta = document.createElement('div'); meta.className = 'meta';
      var tt = document.createElement('div'); tt.className = 't'; tt.textContent = t.title;
      var aa = document.createElement('div'); aa.className = 'a'; aa.textContent = t.artist + (t.size ? ' · ' + fmtBytes(t.size) : '');
      meta.appendChild(tt); meta.appendChild(aa);
      li.appendChild(img); li.appendChild(meta);
      li.onclick = function () { play(i); };
      list.appendChild(li);
    });
  }

  (isNative ? loadNative() : loadWeb()).then(function (rows) { tracks = rows; render(); });
})();
</script>
</body>
</html>
