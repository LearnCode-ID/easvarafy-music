name: Apply Supabase email templates

# Manual only. Requires the repository secret SUPABASE_ACCESS_TOKEN
# (personal access token from https://supabase.com/dashboard/account/tokens).
on:
  workflow_dispatch:
    inputs:
      notifications:
        description: 'Also enable + apply security notification emails'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate templates
        run: node scripts/apply-email-templates.mjs --check
      - name: Apply to Supabase Auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          if [ "${{ inputs.notifications }}" = "true" ]; then
            node scripts/apply-email-templates.mjs
          else
            node scripts/apply-email-templates.mjs --no-notifications
          fi
