name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://kxvckczujvwvfkykofzc.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4dmNrY3p1anZ3dmZreWtvZnpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0Mjc4NjcsImV4cCI6MjExMTAwMzg2N30.QkG9cEZWdDrJHYO3msqi4rhNy2xIQAJrK4zuiTYhi74' }}
      # The APK is a static export with no server of its own: the music routes
      # (/api/music/*) are reached on the deployed web build. Same endpoints,
      # same data source as the web app.
      NEXT_PUBLIC_APP_URL: https://easvarafy-music.vercel.app
      ANDROID_APP_LINKS_SHA256_FINGERPRINTS: ${{ vars.ANDROID_APP_LINKS_SHA256_FINGERPRINTS }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE || 'https://easvarafy-music.vercel.app' }}
      # The APK loads the live web app from this host (capacitor.config.ts
      # server.url), so web deploys update the app without a new APK. The
      # static export above is still bundled as the offline fallback.
      CAPACITOR_SERVER_URL: ${{ secrets.CAPACITOR_SERVER_URL || 'https://easvarafy-music.vercel.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check stable signing configuration
        shell: bash
        run: |
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_APP_LINKS_SHA256_FINGERPRINTS; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing $key. Follow docs/android-app-links.md; ephemeral debug keys cannot verify production links."
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check & unit tests
        run: |
          npx tsc --noEmit -p .
          npx --yes tsx --test \
            lib/metrolist/logic.test.ts \
            lib/metrolist/lyricsEngine.test.ts \
            lib/metrolist/statsEngine.test.ts \
            lib/liquid-glass/refraction.test.ts \
            lib/metrolist/offlineQueue.test.ts \
            lib/app/version.test.ts \
            lib/notifications/shared.test.ts \
            lib/server/fcm.test.ts \
            lib/native/backButton.test.ts \
            lib/native/appLinks.test.ts
          node --test tests/android-app-links.test.mjs

      - name: Build web (static export)
        run: npm run build:static

      - name: Verify export output
        run: |
          if [ ! -f out/index.html ]; then
            echo "::error::out/index.html missing — static export failed"
            exit 1
          fi
          ls -la out | head -20

      - name: Sync Capacitor (Android)
        env:
          # Android versionCode = workflow run number (matches the release tag
          # v<version>-build.<run_number> read by /api/app/version);
          # versionName = package.json "version".
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          export APP_VERSION_NAME="$(node -p "require('./package.json').version")"
          echo "Android versionName ${APP_VERSION_NAME}, versionCode ${APP_VERSION_CODE}"
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/configure-android.mjs
          grep -nE 'versionCode|versionName' android/app/build.gradle
          node scripts/generate-android-icons.mjs
          npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore and verify signing identity
        shell: bash
        run: |
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/easvarafy-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD -file "$RUNNER_TEMP/easvarafy-signing.der"
          node scripts/verify-android-signing.mjs "$RUNNER_TEMP/easvarafy-signing.der"

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: easvarafy-app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::APK not found at $APK_SRC"
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${PKG_VERSION}-build.${{ github.run_number }}"
          fi

          mkdir -p release-assets
          APK_ASSET="release-assets/easvarafy-music.apk"
          cp "$APK_SRC" "$APK_ASSET"
          SHA256=$(sha256sum "$APK_ASSET" | awk '{print $1}')

          NOTES=$(printf '%s\n' \
            "Android APK build from \`${{ github.ref_name }}\` (\`${{ github.sha }}\`)." \
            "" \
            "- **Version:** \`${PKG_VERSION}\` (Build \`#${{ github.run_number }}\`)" \
            "- **Asset:** \`easvarafy-music.apk\`" \
            "- **SHA-256:** \`${SHA256}\`")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_ASSET" --clobber
          else
            gh release create "$TAG" "$APK_ASSET" \
              --title "Easvarafy Music ${TAG}" \
              --notes "$NOTES" \
              --target "${{ github.sha }}" \
              --latest
          fi

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/easvarafy-release.jks" "$RUNNER_TEMP/easvarafy-signing.der"
