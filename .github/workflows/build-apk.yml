name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # The APK is a static export with no server of its own: the music routes
      # (/api/music/*) are reached on the deployed web build. Same endpoints,
      # same data source as the web app.
      NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web (static export)
        run: npm run build:static

      - name: Verify export output
        run: |
          if [ ! -f out/index.html ]; then
            echo "::error::out/index.html missing — static export failed"
            exit 1
          fi
          ls -la out | head -20

      - name: Sync Capacitor (Android)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/configure-android.mjs

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: easvarafy-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::APK not found at $APK_SRC"
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${PKG_VERSION}-build.${{ github.run_number }}"
          fi

          mkdir -p release-assets
          APK_ASSET="release-assets/easvarafy-music.apk"
          cp "$APK_SRC" "$APK_ASSET"
          SHA256=$(sha256sum "$APK_ASSET" | awk '{print $1}')

          NOTES=$(printf '%s\n' \
            "Android APK build from \`${{ github.ref_name }}\` (\`${{ github.sha }}\`)." \
            "" \
            "- **Version:** \`${PKG_VERSION}\` (Build \`#${{ github.run_number }}\`)" \
            "- **Asset:** \`easvarafy-music.apk\`" \
            "- **SHA-256:** \`${SHA256}\`")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_ASSET" --clobber
          else
            gh release create "$TAG" "$APK_ASSET" \
              --title "Easvarafy Music ${TAG}" \
              --notes "$NOTES" \
              --target "${{ github.sha }}" \
              --latest
          fi
